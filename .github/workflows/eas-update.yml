name: ⚡ EAS Update (OTA)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/build-apk.yml'

jobs:
  update:
    name: OTA Update
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack + Yarn
        run: |
          corepack enable
          yarn set version classic

      - name: Install dependencies
        run: yarn install --non-interactive --ignore-optional 2>&1

      - name: Publish OTA update
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Push update to production channel
        run: eas update --channel production --message "${{ github.event.head_commit.message }}" --auto

