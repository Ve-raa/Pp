name: 🔨 Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ─────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Java 17 ────────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 4. Enable Corepack and setup Yarn ─────────────────────────────────
      - name: Enable Corepack + Yarn
        run: |
          corepack enable
          yarn set version classic

      # ── 5. Install JS dependencies via Yarn ───────────────────────────────
      - name: Install dependencies
        run: yarn install --non-interactive --ignore-optional 2>&1

      # ── 6. Verify expo binary ──────────────────────────────────────────────
      - name: Verify expo binary
        run: |
          node_modules/.bin/expo --version
          echo "✅ Expo OK"

      # ── 7. Expo Prebuild → generate android/ native project ───────────────
      - name: Expo Prebuild (Android)
        run: node_modules/.bin/expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: 'https://veraapp.app'

      # ── 8. Accept Android SDK licences ────────────────────────────────────
      - name: Accept Android SDK licences
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ── 9. Make gradlew executable ─────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 10. Build Release APK ──────────────────────────────────────────────
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m'

      # ── 11. Locate the APK ─────────────────────────────────────────────────
      - name: Locate APK
        id: locate
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "❌ APK not found!"; exit 1; fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "✅ APK: $APK ($(du -sh $APK | cut -f1))"

      # ── 12. Upload artifact (30-day retention) ─────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vera-app-build-${{ github.run_number }}
          path: ${{ steps.locate.outputs.path }}
          retention-days: 30

      # ── 13. Create GitHub Release with direct APK download link ───────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "VÉRA — Build #${{ github.run_number }}"
          body: |
            ## 📱 تطبيق VÉRA — بناء رقم ${{ github.run_number }}

            ### طريقة التثبيت على الأندرويد
            1. **حمّل الملف** `app-release.apk` من قسم **Assets** أدناه ⬇️
            2. افتح الملف على هاتفك
            3. إذا ظهر تحذير "مصدر غير معروف" → اذهب للإعدادات وفعّل التثبيت
            4. اكمل التثبيت 🎉

            ---
            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`
          files: ${{ steps.locate.outputs.path }}
          draft: false
          prerelease: false
          make_latest: true
